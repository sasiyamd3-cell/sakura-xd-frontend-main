<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sasiya MD | Admin Control Center</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #080b14;
            --card-bg: #111726;
            --accent-color: #00f0ff;
            --accent-glow: rgba(0, 240, 255, 0.3);
            --danger-color: #ff3366;
            --text-main: #ffffff;
            --text-muted: #8b9bb4;
            --border-color: #1e293b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }
        
        /* Login Overlay */
        #login-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(8, 11, 20, 0.95); display: flex; justify-content: center; align-items: center; z-index: 1000;
        }
        .login-box {
            background: var(--card-bg); padding: 40px; border-radius: 12px;
            border: 1px solid var(--border-color); width: 100%; max-width: 400px; text-align: center;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        .login-box h2 { font-family: 'Orbitron', sans-serif; color: var(--accent-color); margin-bottom: 20px; font-size: 24px; }
        .login-box input {
            width: 100%; padding: 12px; background: #080b14; border: 1px solid var(--border-color);
            border-radius: 6px; color: #fff; margin-bottom: 20px; font-size: 16px; text-align: center; outline: none;
        }
        .login-box input:focus { border-color: var(--accent-color); box-shadow: 0 0 10px var(--accent-glow); }
        .btn {
            background: var(--accent-color); color: #000; border: none; padding: 12px 20px;
            font-weight: 700; border-radius: 6px; cursor: pointer; width: 100%; font-size: 16px;
            transition: 0.3s;
        }
        .btn:hover { box-shadow: 0 0 15px var(--accent-glow); opacity: 0.9; }
        .btn-danger { background: var(--danger-color); color: #fff; }

        /* Dashboard Container */
        #dashboard-container { display: none; flex-direction: column; flex: 1; }
        header {
            background: var(--card-bg); border-bottom: 1px solid var(--border-color);
            padding: 20px 40px; display: flex; justify-content: space-between; align-items: center;
        }
        header h1 { font-family: 'Orbitron', sans-serif; font-size: 20px; color: var(--accent-color); }
        
        .main-content { padding: 30px 40px; max-width: 1400px; margin: 0 auto; width: 100%; }
        
        /* Stats Grid */
        .stats-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 30px;
        }
        .stat-card {
            background: var(--card-bg); border: 1px solid var(--border-color); padding: 20px; border-radius: 10px;
        }
        .stat-card h3 { color: var(--text-muted); font-size: 13px; text-transform: uppercase; margin-bottom: 8px; }
        .stat-card .value { font-size: 28px; font-weight: 700; font-family: 'Orbitron', sans-serif; color: #fff; }

        /* Control Sections */
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        @media(max-width: 900px) { .grid-2 { grid-template-columns: 1fr; } }
        
        .panel {
            background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 10px; padding: 25px; margin-bottom: 30px;
        }
        .panel h2 { font-size: 18px; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; font-family: 'Orbitron', sans-serif; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 6px; }
        .form-group input, .form-group textarea {
            width: 100%; padding: 10px; background: #080b14; border: 1px solid var(--border-color);
            border-radius: 6px; color: #fff; font-size: 14px; outline: none;
        }
        .form-group input:focus { border-color: var(--accent-color); }

        /* Tables */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border-color); font-size: 14px; }
        th { color: var(--text-muted); font-weight: 600; }
        
        .search-bar { display: flex; gap: 10px; margin-bottom: 15px; }
        .search-bar input { flex: 1; padding: 10px; background: #080b14; border: 1px solid var(--border-color); border-radius: 6px; color: #fff; }
    </style>
</head>
<body>

    <!-- Login Screen -->
    <div id="login-overlay">
        <div class="login-box">
            <h2>SASIYA MD ADMIN</h2>
            <input type="password" id="admin-key-input" placeholder="Enter Admin Secret Key">
            <button class="btn" onclick="adminLogin()">Access Terminal</button>
            <p id="login-error" style="color: var(--danger-color); font-size: 12px; margin-top: 15px;"></p>
        </div>
    </div>

    <!-- Dashboard Screen -->
    <div id="dashboard-container">
        <header>
            <h1>⚡ Sasiya MD // Admin Command Center</h1>
            <button class="btn btn-danger" style="width: auto; padding: 8px 15px; font-size: 14px;" onclick="adminLogout()">Logout</button>
        </header>

        <div class="main-content">
            <!-- Stats Overview -->
            <div class="stats-grid">
                <div class="stat-card">
                    <h3>Total Wallets</h3>
                    <div class="value" id="stat-wallets">-</div>
                </div>
                <div class="stat-card">
                    <h3>Coins in Circulation</h3>
                    <div class="value" id="stat-coins">-</div>
                </div>
                <div class="stat-card">
                    <h3>Active Channels</h3>
                    <div class="value" id="stat-channels">-</div>
                </div>
                <div class="stat-card">
                    <h3>Active Sockets</h3>
                    <div class="value" id="stat-sockets">-</div>
                </div>
            </div>

            <div class="grid-2">
                <!-- Coin Management Panel -->
                <div class="panel">
                    <h2>🪙 Wallet & Coin Control</h2>
                    <div class="form-group">
                        <label>Target Phone Number (e.g. 94712345678)</label>
                        <input type="text" id="coin-number" placeholder="Enter phone number">
                    </div>
                    <div class="form-group">
                        <label>Coin Amount</label>
                        <input type="number" id="coin-amount" placeholder="Amount">
                    </div>
                    <div class="form-group">
                        <label>Reason / Note</label>
                        <input type="text" id="coin-reason" placeholder="e.g., Reward, Special Bonus">
                    </div>
                    <div style="display: flex; gap: 10px;">
                        <button class="btn" onclick="modifyCoins('give')">Give Coins</button>
                        <button class="btn" style="background: #ffaa00; color:#000;" onclick="modifyCoins('set')">Set Exact</button>
                        <button class="btn btn-danger" onclick="modifyCoins('deduct')">Deduct</button>
                    </div>
                </div>

                <!-- Global Broadcast Panel -->
                <div class="panel">
                    <h2>📢 Global Coin Broadcast</h2>
                    <div class="form-group">
                        <label>Coins to Add to ALL Users</label>
                        <input type="number" id="broadcast-amount" placeholder="Amount per user">
                    </div>
                    <div class="form-group">
                        <label>Broadcast Reason</label>
                        <input type="text" id="broadcast-reason" placeholder="e.g., Server Milestone Bonus">
                    </div>
                    <button class="btn" style="background: #a855f7; color: #fff;" onclick="broadcastCoins()">Broadcast to All Wallets</button>
                </div>
            </div>

            <!-- Wallets Table Viewer -->
            <div class="panel">
                <h2>📂 Registered Wallets Directory</h2>
                <div class="search-bar">
                    <input type="text" id="search-number" placeholder="Search by phone number..." oninput="loadWallets()">
                </div>
                <div style="overflow-x: auto;">
                    <table>
                        <thead>
                            <tr>
                                <th>Phone Number</th>
                                <th>Coin Balance</th>
                                <th>Last Daily Claim</th>
                            </tr>
                        </thead>
                        <tbody id="wallets-table-body">
                            <tr><td colspan="3" style="text-align: center; color: var(--text-muted);">Loading wallets...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        let adminToken = localStorage.getItem('sasiya_admin_token') || '';

        if (adminToken) {
            verifyToken();
        }

        async function adminLogin() {
            const key = document.getElementById('admin-key-input').value;
            const errEl = document.getElementById('login-error');
            errEl.innerText = '';
            try {
                const res = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ key })
                });
                const data = await res.json();
                if (data.ok) {
                    adminToken = data.token;
                    localStorage.setItem('sasiya_admin_token', adminToken);
                    document.getElementById('login-overlay').style.display = 'none';
                    document.getElementById('dashboard-container').style.display = 'flex';
                    initDashboard();
                } else {
                    errEl.innerText = data.error || 'Invalid Admin Key';
                }
            } catch (e) {
                errEl.innerText = 'Connection error to server.';
            }
        }

        async function verifyToken() {
            try {
                const res = await fetch('/api/admin/me', {
                    headers: { 'x-admin-token': adminToken }
                });
                const data = await res.json();
                if (data.ok) {
                    document.getElementById('login-overlay').style.display = 'none';
                    document.getElementById('dashboard-container').style.display = 'flex';
                    initDashboard();
                } else {
                    localStorage.removeItem('sasiya_admin_token');
                }
            } catch (e) {
                console.error(e);
            }
        }

        async function adminLogout() {
            await fetch('/api/admin/logout', {
                method: 'POST',
                headers: { 'x-admin-token': adminToken }
            });
            localStorage.removeItem('sasiya_admin_token');
            location.reload();
        }

        function initDashboard() {
            loadStats();
            loadWallets();
            setInterval(loadStats, 15000);
        }

        async function loadStats() {
            try {
                const res = await fetch('/api/admin/stats', {
                    headers: { 'x-admin-token': adminToken }
                });
                const data = await res.json();
                if (data.ok) {
                    const st = data.stats;
                    document.getElementById('stat-wallets').innerText = st.totalWallets;
                    document.getElementById('stat-coins').innerText = st.totalCoinsInCirculation;
                    document.getElementById('stat-channels').innerText = st.activeChannels;
                    document.getElementById('stat-sockets').innerText = st.activeSockets;
                }
            } catch (e) { console.error(e); }
        }

        async function modifyCoins(action) {
            const number = document.getElementById('coin-number').value.trim();
            const amount = Number(document.getElementById('coin-amount').value);
            const reason = document.getElementById('coin-reason').value.trim();

            if (!number || !amount) {
                alert('Please enter a valid phone number and amount.');
                return;
            }

            if (!confirm(`Are you sure you want to ${action} ${amount} coins for ${number}?`)) return;

            let endpoint = '/api/admin/coins/give';
            if (action === 'set') endpoint = '/api/admin/coins/set';
            if (action === 'deduct') endpoint = '/api/admin/coins/deduct';

            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-admin-token': adminToken,
                        'x-confirm': 'yes'
                    },
                    body: JSON.stringify({ number, amount, reason })
                });
                const data = await res.json();
                if (data.ok) {
                    alert(`Success! New balance: ${data.coins} coins.`);
                    loadStats();
                    loadWallets();
                } else {
                    alert('Error: ' + (data.error || 'Operation failed'));
                }
            } catch (e) {
                alert('Request failed.');
            }
        }

        async function broadcastCoins() {
            const amount = Number(document.getElementById('broadcast-amount').value);
            const reason = document.getElementById('broadcast-reason').value.trim();

            if (!amount || amount <= 0) {
                alert('Enter a valid amount to broadcast.');
                return;
            }

            if (!confirm(`WARNING: This will distribute ${amount} coins to EVERY registered wallet. Proceed?`)) return;

            try {
                const res = await fetch('/api/admin/coins/broadcast', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-admin-token': adminToken,
                        'x-confirm': 'yes'
                    },
                    body: JSON.stringify({ amount, reason })
                });
                const data = await res.json();
                if (data.ok) {
                    alert(`Broadcast complete! Updated ${data.modified} wallets.`);
                    loadStats();
                    loadWallets();
                } else {
                    alert('Broadcast error: ' + data.error);
                }
            } catch (e) {
                alert('Request failed.');
            }
        }

        async function loadWallets() {
            const search = document.getElementById('search-number').value.trim();
            try {
                const res = await fetch(`/api/admin/wallets?search=${encodeURIComponent(search)}`, {
                    headers: { 'x-admin-token': adminToken }
                });
                const data = await res.json();
                if (data.ok) {
                    const tbody = document.getElementById('wallets-table-data') || document.getElementById('wallets-table-body');
                    tbody.innerHTML = '';
                    if (data.wallets.length === 0) {
                        tbody.innerHTML = `<tr><td colspan="3" style="text-align: center; color: var(--text-muted);">No wallets found</td></tr>`;
                        return;
                    }
                    data.wallets.forEach(w => {
                        const lastClaim = w.lastDailyClaimAt ? new Date(w.lastDailyClaimAt).toLocaleString() : 'Never claimed';
                        tbody.innerHTML += `
                            <tr>
                                <td>${w.number}</td>
                                <td style="color: var(--accent-color); font-weight: bold;">🪙 ${w.coins}</td>
                                <td style="color: var(--text-muted);">${lastClaim}</td>
                            </tr>
                        `;
                    });
                }
            } catch (e) { console.error(e); }
        }
    </script>
</body>
</html>
